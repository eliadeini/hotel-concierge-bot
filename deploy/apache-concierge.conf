# Template — deploy/setup.sh substitutes DOMAIN before installing this to
# /etc/apache2/sites-available/. Proxies the whole site to the app
# (including any future paths like /webhook/whatsapp) — no per-path rules,
# so new routes never need a config change here.
<VirtualHost *:80>
    ServerName DOMAIN

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Only sent once mod_ssl sets the HTTPS env var (i.e. after certbot adds
    # the :443 vhost) — harmless no-op over plain HTTP until then.
    <IfModule mod_headers.c>
        Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains" env=HTTPS
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/concierge-error.log
    CustomLog ${APACHE_LOG_DIR}/concierge-access.log combined
</VirtualHost>