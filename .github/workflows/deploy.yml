name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /home/ubuntu/hotel-concierge-bot
            git pull
            .venv/bin/pip install -r requirements.txt
            sudo systemctl restart concierge
            sleep 2
            if ! systemctl is-active --quiet concierge; then
              echo "concierge service is not active after restart" >&2
              sudo systemctl status concierge --no-pager >&2
              exit 1
            fi
