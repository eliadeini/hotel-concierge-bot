<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>נהרייני - מדריך נהרייני מקומי</title>
<style>
  :root {
    --accent: #1F6F78;
    --accent-dark: #17565D;
    --page-bg: #F5F5F3;
    --header-bg: rgba(255, 255, 255, 0.6);
    --chat-panel-bg: rgba(245, 245, 243, 0.5);
    --border: #E2E2DE;
    --bubble-out: #DDEEF0;
    --bubble-in: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    background: var(--page-bg) url("/static/Nahariya-bg.jpg") center / cover no-repeat fixed;
  }

  /* --- Header --- */
  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
    flex: 0 0 auto;
    z-index: 1;
  }
  header .site-name {
    font-weight: 700;
    font-size: 18px;
    color: var(--accent-dark);
  }
  header .tagline {
    font-size: 13px;
    color: #6b7280;
    margin-top: 2px;
  }

  /* --- Chat area --- */
  #chat {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 16px 8%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--chat-panel-bg);
  }
  @media (max-width: 700px) {
    #chat { padding: 16px 4%; }
  }

  .bubble-row {
    display: flex;
    flex-direction: column;
    max-width: 75%;
  }
  .bubble-row.out { align-self: flex-end; align-items: flex-end; }
  .bubble-row.in { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14.5px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .bubble-row.out .bubble { background: var(--bubble-out); border-color: var(--bubble-out); }
  .bubble-row.in .bubble { background: var(--bubble-in); }

  .meta {
    font-size: 11px;
    color: #7a7a75;
    margin-top: 2px;
    padding: 0 4px;
  }
  .meta.kb-yes { color: #2b7a3d; }
  .meta.kb-no { color: #9a7b1f; }

  .timestamp {
    font-size: 10.5px;
    color: #9a9a95;
    margin-top: 1px;
    padding: 0 4px;
  }

  /* --- Typing indicator --- */
  .typing-bubble {
    display: flex;
    gap: 4px;
    padding: 10px 12px;
  }
  .typing-bubble span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #b0b0aa;
    display: inline-block;
    animation: bounce 1.2s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* --- Input bar --- */
  #input-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--header-bg);
    border-top: 1px solid var(--border);
  }
  #question {
    flex: 1 1 auto;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 10px 16px;
    font-size: 14.5px;
    outline: none;
    resize: none;
    max-height: 100px;
    font-family: inherit;
  }
  #question:focus { border-color: var(--accent); }
  #send {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #send:disabled, #question:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #send:not(:disabled):active { background: var(--accent-dark); }
</style>
</head>
<body>

<header>
  <div class="site-name">נהרייני</div>
  <div class="tagline">מדריך נהרייני מקומי — שאלו אותי כל דבר על ביקור בנהריה: חופים, מסעדות, טיולים ועוד</div>
</header>

<div id="chat"></div>

<div id="input-bar">
  <textarea id="question" rows="1" placeholder="הקלד/י שאלה..." dir="auto"></textarea>
  <button id="send" title="שלח">➤</button>
</div>

<script>
  const chat = document.getElementById("chat");
  const questionInput = document.getElementById("question");
  const sendButton = document.getElementById("send");

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function formatTime() {
    const d = new Date();
    return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
  }

  function appendBubble(text, direction) {
    const row = document.createElement("div");
    row.className = "bubble-row " + direction;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.dir = "auto";
    bubble.textContent = text;
    row.appendChild(bubble);

    const time = document.createElement("div");
    time.className = "timestamp";
    time.textContent = formatTime();
    row.appendChild(time);

    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  function appendMeta(row, foundInKb) {
    const meta = document.createElement("div");
    meta.className = "meta " + (foundInKb ? "kb-yes" : "kb-no");
    meta.textContent = foundInKb
      ? "✓ מבוסס על מידע מקומי מאומת"
      : "ℹ️ ידע כללי — לא מאומת מול מידע מקומי";
    row.appendChild(meta);
    scrollToBottom();
  }

  function appendTypingIndicator() {
    const row = document.createElement("div");
    row.className = "bubble-row in";
    const bubble = document.createElement("div");
    bubble.className = "bubble typing-bubble";
    bubble.innerHTML = "<span></span><span></span><span></span>";
    row.appendChild(bubble);
    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  async function send() {
    const question = questionInput.value.trim();
    if (!question) return;

    questionInput.value = "";
    questionInput.disabled = true;
    sendButton.disabled = true;

    appendBubble(question, "out");
    const typingRow = appendTypingIndicator();

    try {
      const response = await fetch("/chatbot/nahariya/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question }),
      });

      typingRow.remove();

      if (!response.ok) {
        const errRow = appendBubble("שגיאה: לא הצלחתי לקבל תשובה כרגע.", "in");
        appendMeta(errRow, false);
      } else {
        const data = await response.json();
        const answerRow = appendBubble(data.text, "in");
        appendMeta(answerRow, data.found_in_kb);
      }
    } catch (err) {
      typingRow.remove();
      const errRow = appendBubble("שגיאת רשת — לא הצלחתי להתחבר לשרת.", "in");
      appendMeta(errRow, false);
    } finally {
      questionInput.disabled = false;
      sendButton.disabled = false;
      questionInput.focus();
    }
  }

  sendButton.addEventListener("click", send);
  questionInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  questionInput.focus();
</script>

</body>
</html>
